theme: minima
title: The International Race of Hammpions Show
description: "Multinational morning drive-time radio from Rio, Knoxville and the Twin Cities: automotive excellence, tales from beyond and the Global Fleet of Hammpions."
url: https://irohpodcast.com
lang: en-US
logo: /_images/IROH_SocialLogo.png

author:
  name: Hammpions Broadcast International

social:
  name: The International Race of Hammpions Show
  links:
    - https://bsky.app/profile/irohpodcast.com

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Jekyll normally excludes folders beginning with an underscore. This makes
# the studio artwork available at /_images/ on the finished site.
include:
  - _images

# Prevent the homepage H1 from becoming a duplicate navigation link.
titles_from_headings:
  enabled: false
