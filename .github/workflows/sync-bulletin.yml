name: Refresh Network Bulletin

on:
  workflow_dispatch:

  schedule:
    # Refresh the Bluesky-powered Network Bulletin every 30 minutes. The
    # offset keeps it away from the normal Friday RSS release checks.
    # GitHub schedules use UTC.
    - cron: "11,41 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Queue behind a full RSS deployment instead of cancelling it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      should_deploy: ${{ steps.state.outputs.should_deploy }}

    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh the Network Bulletin
        run: python scripts/sync_podcast.py --bulletin-only

      - name: Check whether the bulletin changed
        id: state
        run: |
          git status --porcelain -- _data/network_bulletin.json > /tmp/bulletin-status

          if [ -s /tmp/bulletin-status ]; then
            echo "bulletin_changed=true" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "bulletin_changed=false" >> "$GITHUB_OUTPUT"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the updated Network Bulletin
        if: steps.state.outputs.bulletin_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/network_bulletin.json
          git commit -m "Update Network Bulletin [skip ci]"
          git push

      - name: Configure GitHub Pages
        if: steps.state.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Build the Jekyll website
        if: steps.state.outputs.should_deploy == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload the finished website
        if: steps.state.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
