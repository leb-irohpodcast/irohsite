name: Sync broadcasts and deploy website

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # Checks every 15 minutes around the normal Friday release window.
    # GitHub schedules use UTC.
    - cron: "7,22,37,52 0-5 * * 5"

    # Full fallback refresh for specials, delayed releases, transcripts and
    # scheduled poll changes. The Network Bulletin has its own faster job.
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Let an in-progress bulletin deployment finish before a full RSS deployment.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      should_deploy: ${{ steps.state.outputs.should_deploy }}

    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh broadcast, bulletin and poll data
        run: python scripts/sync_podcast.py

      - name: Check whether station data changed
        id: state
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git status --porcelain -- _data/episodes.json _data/network_bulletin.json _data/current_poll.json broadcasts transcripts > /tmp/episode-status

          if [ -s /tmp/episode-status ]; then
            echo "feed_changed=true" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "feed_changed=false" >> "$GITHUB_OUTPUT"

            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Save updated station data and transcripts
        if: steps.state.outputs.feed_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/episodes.json _data/network_bulletin.json _data/current_poll.json
          if [ -d broadcasts ]; then
            git add broadcasts
          fi
          if [ -d transcripts ]; then
            git add transcripts
          fi
          git commit -m "Update broadcasts and station data"
          git push

      - name: Configure GitHub Pages
        if: steps.state.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Build the Jekyll website
        if: steps.state.outputs.should_deploy == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload the finished website
        if: steps.state.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
